<!-- @dsCard group="Colors" viewport="700x180" name="Evidencia y mito" subtitle="Amarillo #FFC300 = hallazgo respaldado · Coral = creencia falsa" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font:var(--type-body)}
.sw{flex:1}.sw i{display:block;height:56px;border-radius:var(--radius-sm);box-shadow:var(--shadow-hairline)}
.sw b{display:block;margin-top:6px;font-family:var(--font-mono);font-weight:400;font-size:10px;color:var(--text-muted)}
.tag{display:inline-flex;height:23px;align-items:center;padding:0 9px;border-radius:var(--radius-xs);font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase}</style></head>
<body><div style="display:flex;gap:6px">
<span class="sw"><i style="background:var(--gold-300)"></i><b>gold-300</b></span>
<span class="sw"><i style="background:var(--gold-400)"></i><b>gold-400 · #FFC300</b></span>
<span class="sw"><i style="background:var(--gold-500)"></i><b>gold-500</b></span>
<span class="sw"><i style="background:var(--gold-600)"></i><b>gold-600</b></span>
<span class="sw"><i style="background:var(--gold-700)"></i><b>gold-700 · filetes</b></span>
<span class="sw"><i style="background:var(--coral-300)"></i><b>coral-300</b></span>
<span class="sw"><i style="background:var(--coral-400)"></i><b>coral-400</b></span>
<span class="sw"><i style="background:var(--coral-500)"></i><b>coral-500</b></span>
</div>
<div style="display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap">
<span class="tag" style="background:var(--coral-400);color:#fff">Mito</span>
<span class="tag" style="background:var(--gold-400);color:var(--accent-evidence-ink)">Respaldado</span>
<span class="tag" style="background:var(--cyan-400);color:var(--accent-info-ink)">Estudio 2024</span>
<span style="font-size:13px;color:var(--text-muted)">Sobre claro el amarillo va como relleno con tinta navy (<code style="font-family:var(--font-mono);font-size:12px">.ecc-mark</code>), nunca como texto. Los tonos oscurecidos solo en filetes y bordes de 2-3px.</span></div>
</body></html>
