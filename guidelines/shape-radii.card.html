<!-- @dsCard group="Spacing" viewport="700x170" name="Radios" subtitle="Controles y chips en píldora; carcasa 32px y núcleo concéntrico calculado" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);font:var(--type-body)}
.s{display:flex;flex-direction:column;align-items:center;gap:8px}
.b{width:84px;height:56px;background:var(--navy-100);box-shadow:inset 0 0 0 1px var(--border-strong)}
.t{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style></head>
<body><div style="display:flex;gap:14px;align-items:center">
<div class="s"><div class="b" style="border-radius:var(--radius-xs)"></div><span class="t">xs · 4px</span></div>
<div class="s"><div class="b" style="border-radius:var(--radius-sm)"></div><span class="t">sm · 10px</span></div>
<div class="s"><div class="b" style="border-radius:var(--radius-md)"></div><span class="t">md · 16px</span></div>
<div class="s"><div class="b" style="border-radius:var(--radius-lg)"></div><span class="t">lg · 24px</span></div>
<div class="s"><div class="b" style="border-radius:var(--radius-shell)"></div><span class="t">shell · 32px</span></div>
<div class="s"><div class="b" style="border-radius:var(--radius-pill)"></div><span class="t">pill · 999px</span></div>
<div class="s" style="align-items:flex-start;margin-left:6px">
<span class="t" style="line-height:1.7">--radius-card = shell<br>--radius-control = pill<br>núcleo = shell − 6px</span></div></div></body></html>
