<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{padding:20px 24px;background:var(--surface-page)}#r{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;align-items:start}</style>
</head><body><div id="r"></div>
<script type="text/babel">
let Input,Select,Checkbox,Switch,Card;
function Demo(){const [ok,setOk]=React.useState(true),[sw,setSw]=React.useState(true);return (<>
<Input label="Tu correo" placeholder="nombre@correo.com" hint="Te enviamos la guía de déficit calórico" prefix={<i className="ph-light ph-envelope-simple" style={{fontSize:17}}></i>}/>
<Input label="Peso corporal" placeholder="70" suffix={<span style={{fontFamily:'var(--font-mono)',fontSize:13}}>kg</span>}/>
<Select label="Objetivo" options={['Perder grasa','Ganar músculo','Rendimiento']}/>
<Input label="PMID" placeholder="20921542" error="Ese PMID no existe en PubMed" prefix={<i className="ph-light ph-magnifying-glass" style={{fontSize:17}}></i>}/>
<div style={{display:'flex',flexDirection:'column',gap:14}}>
<Checkbox label="Quiero los estudios de la semana" checked={ok} onChange={e=>setOk(e.target.checked)}/>
<Checkbox label="Solo temas de nutrición" checked={false} onChange={()=>{}}/>
<Switch label="Subtítulos" checked={sw} onChange={setSw}/>
</div>
<Card theme="dark" padding="md">
<div style={{display:'flex',flexDirection:'column',gap:14}}>
<Input onDark label="Tu correo" placeholder="nombre@correo.com"/>
<Switch onDark label="Recordatorio semanal" checked={sw} onChange={setSw}/>
</div></Card>
</>)}
const boot=async()=>{const NS=await window.__ensureDS('../../',[]);({Input,Select,Checkbox,Switch,Card}=NS);ReactDOM.createRoot(document.getElementById('r')).render(<Demo/>);window.__eccIcons()};
boot();
</script></body></html>
